name: Scotland award + cash fare monitor

on:
  schedule:
    - cron: "30 10 * * *"     # 06:30 America/New_York (EDT) daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        id: run
        env:
          SEATSAERO_API_KEY: ${{ secrets.SEATSAERO_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          mkdir -p data
          set +e
          python3 monitor.py --state data/state.json --config config.json > data/report.md 2> data/last_run.log
          rc=$?
          set -e
          echo "changed=$(cat data/last_run_changed 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          echo "---- run log ----"; cat data/last_run.log
          echo "---- report ----"; cat data/report.md
          if [ "$rc" -ne 0 ]; then
            # keep the last good report; persist the failure log so it can be read from the repo
            git checkout -- data/report.md 2>/dev/null || rm -f data/report.md
            echo "monitor exited $rc" >> data/last_run.log
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Commit state
        if: always()
        run: |
          git config user.name "fare-monitor[bot]"
          git config user.email "fare-monitor@users.noreply.github.com"
          git add -A data/
          git commit -m "monitor: $(date -u +%Y-%m-%dT%H:%MZ) changed=${{ steps.run.outputs.changed }} rc=${{ steps.run.outputs.rc }}" || echo "nothing to commit"
          git push

      - name: Fail if monitor failed
        if: steps.run.outputs.rc != '0'
        run: exit 1

      - name: Open issue on change
        if: steps.run.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="✈️ Scotland fares: changes $(date -u +%Y-%m-%d)"
          gh issue create --title "$title" --body-file data/report.md --label "fare-alert" 2>/dev/null \
            || gh issue create --title "$title" --body-file data/report.md
